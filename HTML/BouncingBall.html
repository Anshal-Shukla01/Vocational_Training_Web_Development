<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Ball</title>
    <style>
        .Scene{
                margin:0;                   /* Removes default browser spacing */
                height:100vh;   
                width:100vw;           /* "Take 100% width of the browser window."   */         
                position: relative;
                display: block;
               
            }
        .Ball{
            background-color: Red;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            position:absolute;  
            top:50%;
            left: 50%;
            animation-name:Bounce;
            animation-iteration-count: infinite;
            animation-duration: 5s;
            animation-timing-function: linear;
        }    
            @keyframes Bounce{

             0%{top:50%;}
            25%{top:40%;}
            50%{top:30%;}
            75%{top:40%;}
            100%{top:50%;}
            
        }
        
        .Ground{
            background-color: green;
            height:500px;
            width:100%;            /* Take 100% width of my parent */ 
         /* width:100vw;            "Take 100% width of the browser window." */
             position:absolute;
             transform: translateY(100px);
            top:50%;
              
    

        }
    </style>
</head>
<body>
    <div class="Scene">
        <div class="Ball"></div>
        <div class="Ground"></div>
    </div>
    
</body>
</html>
